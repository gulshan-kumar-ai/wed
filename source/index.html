<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#E67E22" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pamoora Wedding" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Samsung Internet / Chrome "force dark" would invert the card's colours -->
    <meta name="color-scheme" content="only light" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Title, description and link-preview tags are generated from src/config/wedding.js at build time (see vite.config.js). -->
    <!-- __SOCIAL_META__ -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without holding up the first paint (slow mobile data): text shows at once and swaps in -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Noto+Serif+Devanagari:wght@500;600&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Noto+Serif+Devanagari:wght@500;600&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <style>
      /* Shown while the invitation loads (React replaces it), so a slow phone never sees a blank page */
      .boot {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fdf8f0;
      }
      .boot-om {
        width: 76px;
        height: 76px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 42px;
        line-height: 1;
        color: #a93226;
        background: radial-gradient(circle, #fff6da 0%, #f6e6a6 100%);
        box-shadow: 0 0 0 3px #d4af37, 0 10px 30px rgba(169, 50, 38, 0.25);
        animation: boot 1.6s ease-in-out infinite;
      }
      @keyframes boot {
        50% {
          transform: scale(1.07);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-om {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" aria-hidden="true"><div class="boot-om">ॐ</div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
