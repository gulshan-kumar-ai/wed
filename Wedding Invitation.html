    <style>
      /* Shown while the invitation loads (React replaces it), so a slow phone never sees a blank page */
      .boot {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fdf8f0;
      }
      .boot-om {
        width: 76px;
        height: 76px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 42px;
        line-height: 1;
        color: #a93226;
        background: radial-gradient(circle, #fff6da 0%, #f6e6a6 100%);
        box-shadow: 0 0 0 3px #d4af37, 0 10px 30px rgba(169, 50, 38, 0.25);
        animation: boot 1.6s ease-in-out infinite;
      }
      @keyframes boot {
        50% {
          transform: scale(1.07);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-om {
          animation: none;
        }
      }
